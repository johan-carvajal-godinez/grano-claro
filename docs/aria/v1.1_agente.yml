- banner:
  - heading "Grano Claro" [level=1]
  - text: "#top"
  - paragraph: "Tienda de café en una sola página: una persona puede comprar directamente y un agente de software puede comprar en su nombre."
  - paragraph:
    - strong: "Demostración:"
    - text: los pedidos son simulados y no se cobra nada.
  - group "Navegar como":
    - text: Navegar como
    - radio "Persona"
    - text: Persona Tarjetas con variedad, proceso y notas de cata.
    - radio "Agente" [checked]
    - text: Agente Tabla con SKU, herramientas, consola y datos estructurados.
    - paragraph: "Las dos vistas comparten catálogo, carrito y pedido: cambiar de vista no borra nada."
    - paragraph
  - navigation "Secciones de la página":
    - list:
      - listitem:
        - link "Para agentes":
          - /url: "#for-agents"
      - listitem:
        - link "Consola":
          - /url: "#agent-console"
      - listitem:
        - link "Catálogo":
          - /url: "#catalog"
      - listitem:
        - link "Variedades":
          - /url: "#variety-guide"
      - listitem:
        - link "Carrito":
          - /url: "#cart"
      - listitem:
        - link "Pedido":
          - /url: "#checkout"
      - listitem:
        - link "Políticas":
          - /url: "#policies"
- main:
  - region "Estado":
    - heading "Estado" [level=2]
    - text: "#status"
    - status: Listo La página está lista. Todavía no se ha hecho ninguna acción. Evento 0.
    - paragraph: "Carrito: 0 bolsas, subtotal USD 0.00. Último pedido: ninguno."
  - region "Para agentes":
    - heading "Para agentes" [level=2]
    - text: "#for-agents"
    - paragraph:
      - text: "Todo lo que se puede hacer en esta tienda está en esta página: sin ventanas emergentes, sin desplazamiento infinito y sin pasos que caduquen en menos de 30 minutos. Cada acción deja su resultado en"
      - link "Estado":
        - /url: "#status-panel"
      - text: (
      - code: "#status"
      - text: ) con un número de evento y un código.
    - list:
      - listitem:
        - text: Consulte el
        - link "catálogo":
          - /url: "#catalog"
        - text: ": 13 cafés, 7 de ellos de Costa Rica, con SKU, variedad, precio en USD (impuestos incluidos), peso en gramos y bolsas disponibles. Para filtrarlo, use el formulario"
        - code: "#filters"
        - text: o la URL, por ejemplo
        - code: "?origin=CR&in_stock_only=true"
        - text: .
      - listitem:
        - text: Agregue cafés con el formulario
        - code: "#add-to-cart"
        - text: ": marque la fila del café, elija la molienda y la cantidad, y pulse «Agregar al carrito»."
      - listitem:
        - text: Revise el
        - link "carrito":
          - /url: "#cart"
        - text: . Cada línea tiene un identificador (L1, L2…) y un botón «Quitar».
      - listitem:
        - text: Prepare el pedido con
        - code: "#prepare-order"
        - text: ". Este paso no cobra: calcula el envío y devuelve el número de pedido y el total exacto."
      - listitem:
        - text: Muestre ese total a la persona usuaria. Con su aprobación, escriba el total en
        - code: "#confirm-order"
        - text: ; ella pulsa «Confirmar y pagar», el único paso con cargo, desde la vista Persona.
    - heading "Convenciones" [level=3]
    - term: Montos
    - definition: "USD con punto decimal: 14.50 son catorce dólares con cincuenta centavos. Impuestos incluidos."
    - term: Fechas
    - definition: ISO 8601 (AAAA-MM-DD). La tienda usa la hora UTC−06:00.
    - term: Identificadores
    - definition:
      - text: SKU de
      - code: GC-001
      - text: a
      - code: GC-013
      - text: ; origen como código de país ISO 3166-1 (
      - code: CO
      - text: ","
      - code: CR
      - text: ","
      - code: ET
      - text: …); variedad con su nombre, como en el filtro (
      - code: Villa Sarchí
      - text: ","
      - code: Geisha
      - text: …); molienda como
      - code: whole
      - text: ","
      - code: espresso
      - text: ","
      - code: filter
      - text: o
      - code: french_press
      - text: .
    - term: Errores
    - definition:
      - text: Código estable (por ejemplo
      - code: ERR_STOCK
      - text: ), el motivo y cómo corregirlo. Los mensajes permanecen hasta la siguiente acción.
    - heading "Otras formas de usar la tienda" [level=3]
    - term: Vistas
    - definition:
      - text: "Esta es la vista Agente: tabla con SKU, herramientas y"
      - link "consola":
        - /url: "#agent-console"
      - text: . La vista Persona muestra los mismos cafés en tarjetas. Las dos comparten carrito y pedido; para abrir esta vista directamente, añada
      - code: "#modo-agente"
      - text: al enlace de la página.
    - term: WebMCP
    - definition:
      - text: "Cada formulario es una herramienta:"
      - code: search_products
      - text: ","
      - code: add_to_cart
      - text: ","
      - code: prepare_order
      - text: "y"
      - code: confirm_order
      - text: ; además se registran
      - code: remove_from_cart
      - text: "y"
      - code: get_cart
      - text: .
      - code: confirm_order
      - text: "solo rellena el formulario: el envío lo hace la persona."
    - term: JavaScript
    - definition:
      - code: await granoClaro.call(nombre, argumentos)
      - text: con las mismas herramientas, salvo
      - code: confirm_order
      - text: .
      - code: granoClaro.snapshot()
      - text: devuelve el estado, y
      - code: granoClaro.view()
      - text: ", la vista activa. Los esquemas JSON están en"
      - code: "#agent-tools"
      - text: .
    - term: HTTP
    - definition:
      - text: "En el sitio publicado:"
      - code: /llms.txt
      - text: ","
      - code: /index.md
      - text: y la API de
      - code: /openapi.yaml
      - text: . En esta vista previa funcionan la página y su API JavaScript.
  - region "Consola del agente":
    - heading "Consola del agente" [level=2]
    - text: "#agent-console"
    - paragraph:
      - text: Compre como lo haría un agente que ejecuta código. Cada llamada usa
      - code: granoClaro.call(nombre, argumentos)
      - text: ": el resultado JSON aparece aquí y en"
      - link "Estado":
        - /url: "#status-panel"
      - text: ", y el catálogo, el carrito y el pedido se actualizan igual que con los formularios."
    - heading "Recorrido de ejemplo" [level=3]
    - list "Recorrido de ejemplo":
      - listitem:
        - text: "Buscar cafés de Costa Rica con bolsas disponibles:"
        - code: search_products
        - text: con
        - code: "{\"origin\":\"CR\",\"in_stock_only\":true}"
        - text: .
        - button "Ejecutar el paso 1"
      - listitem:
        - text: Agregar 2 bolsas de Dota (
        - code: GC-007
        - text: ") molidas para filtro:"
        - code: add_to_cart
        - text: con
        - code: "{\"sku\":\"GC-007\",\"grind\":\"filter\",\"quantity\":2}"
        - text: .
        - button "Ejecutar el paso 2"
      - listitem:
        - text: "Revisar el carrito:"
        - code: get_cart
        - text: .
        - button "Ejecutar el paso 3"
      - listitem:
        - text: "Preparar el pedido, sin cobro, con datos de ejemplo y envío a domicilio:"
        - code: prepare_order
        - text: ". Si el carrito estaba vacío al empezar, el total es USD 38.00: 2 × 16.50 = 33.00, más 5.00 de envío (gratis desde USD 40.00)."
        - button "Ejecutar el paso 4"
      - listitem:
        - text: Escribir el total en el paso 2 (
        - code: "#confirm-order"
        - text: ) sin enviarlo, como hace un agente WebMCP con
        - code: confirm_order
        - text: .
        - button "Ejecutar el paso 5"
      - listitem:
        - text: "Intentar pagar por JavaScript:"
        - code: confirm_order
        - text: responde
        - code: ERR_HUMAN_STEP
        - text: .
        - button "Ejecutar el paso 6"
    - button "Ejecutar los 6 pasos"
    - button "Pasar a la vista Persona para pagar"
    - paragraph: "El pago lo decide la persona: en la vista Persona el total ya está escrito y solo falta pulsar «Confirmar y pagar»."
    - heading "Llamada libre" [level=3]
