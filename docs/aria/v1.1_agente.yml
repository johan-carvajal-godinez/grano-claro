      - textbox "Argumentos (JSON)": "{ \"origin\": \"CR\", \"variety\": \"Geisha\" }"
      - button "Ejecutar"
      - button "Cargar ejemplo"
      - paragraph
    - paragraph: Resultado
    - text: Todavía no hay ninguna llamada.
    - heading "Últimas llamadas" [level=3]
    - list:
      - listitem: Ninguna todavía.
    - heading "Lo que percibe un agente" [level=3]
    - paragraph: "Un agente percibe una página de cuatro maneras: la captura de pantalla (lo que usted ve), el árbol de accesibilidad, el HTML sin procesar y las herramientas estructuradas."
    - group: Árbol de accesibilidad aproximado
