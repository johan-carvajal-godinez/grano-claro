    - heading "Catálogo" [level=2]
    - text: "#catalog"
    - paragraph: 6 cafés de especialidad en bolsas selladas. Precio por bolsa en USD, impuestos incluidos. Envío a domicilio USD 5.00, gratis desde USD 40.00; retiro en tienda sin costo.
    - search "Filtrar el catálogo":
      - heading "Filtrar el catálogo" [level=3]
      - text: "#filters Texto"
      - searchbox "Texto"
      - text: "Nombre, región, país o proceso. Ejemplo: natural. Origen"
