  - region "Pedido":
    - heading "Pedido" [level=2]
    - paragraph: El pedido se hace en dos pasos. El paso 1 calcula el total sin cobrar. El paso 2 cobra y necesita la aprobación explícita de la persona usuaria.
    - form "Paso 1. Preparar el pedido":
      - heading "Paso 1. Preparar el pedido" [level=3]
      - text: Nombre y apellido
      - textbox "Nombre y apellido"
      - text: Correo electrónico
      - textbox "Correo electrónico"
      - text: Recibe el comprobante. Formato nombre@dominio.tld
      - group "Entrega":
        - text: Entrega
        - radio "Envío a domicilio (USD 5.00; gratis desde USD 40.00)"
        - text: Envío a domicilio (USD 5.00; gratis desde USD 40.00)
        - radio "Retiro en tienda (sin costo)"
        - text: Retiro en tienda (sin costo)
      - text: Dirección de entrega
      - textbox "Dirección de entrega"
      - text: Obligatoria si elige envío a domicilio. Fecha de entrega
      - textbox "Fecha de entrega":
        - /placeholder: AAAA-MM-DD
      - text: Formato AAAA-MM-DD, entre 2026-10-17 y 2026-11-14. Indicaciones (opcional)
      - textbox "Indicaciones (opcional)"
      - button "Preparar pedido (sin cobro)"
      - paragraph
    - form "Paso 2. Confirmar y pagar":
      - heading "Paso 2. Confirmar y pagar" [level=3]
      - paragraph: Este paso cobra el pedido. Antes de enviarlo, la persona usuaria tiene que haber aprobado el total exacto. Escribir el total es la prueba de que se revisó.
      - group:
        - text: Total aprobado (USD)
        - textbox "Total aprobado (USD)" [disabled]
        - button "Confirmar y pagar" [disabled]
        - paragraph: Escriba el total del resumen, por ejemplo 31.00.
      - paragraph: No hay ningún pedido preparado.
  - region "Políticas":
    - heading "Políticas" [level=2]
    - term: Sin aprobación previa
    - definition: Consultar y filtrar el catálogo, agregar y quitar cafés del carrito, preparar pedidos.
    - term: Con aprobación explícita
    - definition: Confirmar y pagar. La persona usuaria aprueba el total exacto antes de cada pago.
    - term: Límites
    - definition: Hasta 10 bolsas por café y pedido. Un pedido preparado vence a los 30 minutos y se anula si el carrito cambia.
    - term: Datos personales
    - definition: Nombre, correo y, para envíos, dirección. Se usan solo para entregar el pedido.
    - term: Contacto humano
    - definition:
      - link "soporte@granoclaro.example":
        - /url: mailto:soporte@granoclaro.example
