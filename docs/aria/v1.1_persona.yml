    - region "Variedades de Costa Rica":
      - heading "Variedades de Costa Rica" [level=3]
      - paragraph: Los 7 cafés de Costa Rica vienen de 7 regiones cafetaleras distintas y reúnen estas 7 variedades.
      - term: Catuaí
      - definition: "Cruce de Caturra amarillo y Mundo Novo, hecho en 1949 en el Instituto Agronômico de Campinas (Brasil) y liberado en 1972. En la tienda: Dota (GC-007) y San Vito (GC-012)."
      - term: Caturra
      - definition: "Mutación natural enana de Bourbon, descubierta en Minas Gerais (Brasil) entre 1915 y 1918. En la tienda: Dota (GC-007)."
      - term: Centroamericano (H1)
      - definition: "Híbrido F1 entre T5296, una línea Sarchimor, y Rume Sudan. Lo desarrollaron CIRAD, PROMECAFE y el CATIE, y se liberó en 2010. En la tienda: Orosi (GC-010)."
      - term: Costa Rica 95
      - definition: "Catimor (Híbrido de Timor × Caturra) que el ICAFE seleccionó por su rendimiento y su resistencia a la roya y al ojo de gallo; hoy es susceptible a ambas enfermedades. En la tienda: Hojancha (GC-013)."
      - term: Geisha
      - definition: "Originaria del bosque de Gori Gesha, en Etiopía. En 1953 llegó al CATIE, en Costa Rica. En la tienda: Rivas (GC-011)."
      - term: Villa Sarchí
      - definition: "Mutación natural enana de Bourbon, hallada en el noroeste de Alajuela en las décadas de 1950 o 1960. Es uno de los progenitores del Sarchimor original y, por esa vía, de T5296 y de Centroamericano. En la tienda: Sarchí (GC-008)."
      - term: Villalobos
      - definition: "Mutación natural enana de Typica, presente sobre todo en Costa Rica. En la tienda: Tres Ríos (GC-009)."
      - paragraph: "Regiones según la reorganización del ICAFE de 2025: Tarrazú pasó a llamarse Los Santos; Tres Ríos se unió a Valle Central, y Orosi, a Turrialba; Brunca se dividió en Pérez Zeledón y Coto Brus, y Guanacaste se integró a Zona Norte. Los cafés de Tres Ríos y Orosi conservan el nombre local. Altitudes, notas de cata, precios y existencias son ficticios, como la tienda."
      - paragraph: "Fuentes, consultadas el 13 de octubre de 2026:"
      - list:
        - listitem:
          - link "El Financiero":
            - /url: https://www.elfinancierocr.com/economia-y-politica/tres-rios-desaparece-del-mapa-de-las-regiones/YPE3AYVL7JHVFOHPLYZM3VWHQM/story/
          - text: "(F. Ruiz León, 22 de junio de 2025): cambios en las regiones cafetaleras."
        - listitem:
          - link "World Coffee Research, «T5296»":
            - /url: https://varieties.worldcoffeeresearch.org/varieties/t5296
          - text: ": linaje de T5296 y de Centroamericano."
        - listitem:
          - text: "Ozone Coffee:"
          - link "Villa Sarchí":
            - /url: https://ozonecoffee.co.uk/blogs/varietals/coffee-varietal-villa-sarchi
          - text: ","
          - link "Caturra":
            - /url: https://ozonecoffee.co.uk/blogs/varietals/coffee-varietal-caturra
          - text: ","
          - link "Catuaí":
            - /url: https://ozonecoffee.co.uk/blogs/varietals/coffee-varietal-catuai
          - text: "y"
          - link "Centroamericano":
            - /url: https://ozonecoffee.co.uk/blogs/varietals/coffee-varietal-centroamericano
          - text: .
        - listitem:
          - text: "Sweet Maria's:"
          - link "Villalobos":
            - /url: https://library.sweetmarias.com/glossary/villalobos/
          - text: "y"
          - link "Costa Rica 95":
            - /url: https://library.sweetmarias.com/glossary/costa-rica-95-cr95-variety/
          - text: .
        - listitem:
          - link "Wikipedia, «Geisha (coffee)»":
            - /url: https://en.wikipedia.org/wiki/Geisha_(coffee)
          - text: ": origen de Geisha y llegada al CATIE."
